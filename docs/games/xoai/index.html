<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xoài rụng rồi!</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#fff59d" flood-opacity="1"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#3b1d05" flood-opacity=".35"/>
    </filter>
  </defs>

  <image href="art/background.webp" width="1600" height="900" preserveAspectRatio="none"/>
  <g id="tree-mangoes"></g>
  <g id="tree-labels"></g>

  <g id="redkid" transform="translate(120 762)">
    <g class="hop">
      <image class="idle" href="art/kid-point.webp" x="-78.4" y="-240" width="156.7" height="240"/>
      <image class="cheer" href="art/kid-cheer.webp" x="-84.9" y="-281" width="169.8" height="251.2"/>
    </g>
  </g>

  <g id="beo">
    <g class="hop">
      <g id="pole"><image href="art/pole.webp" y="-52" width="2103" height="105" preserveAspectRatio="none"/></g>
      <image class="ready" href="art/beo-ready.webp" x="-167.6" y="-340" width="335.1" height="340"/>
      <image class="poke" href="art/beo-poke.webp" x="-167.6" y="-340" width="335.1" height="340"/>
    </g>
  </g>

  <image id="plate" href="art/plate.webp" x="235" y="718" width="250" height="163" filter="url(#soft)"/>
  <g id="fallen"></g>
  <g id="particles"></g>
  <g id="bubbles"></g>
  <text id="shout" x="800" y="420" text-anchor="middle"></text>
</svg>

<div class="hud top-left"><a class="chip" href="../../" aria-label="Home">←</a></div>
<div class="hud top-right">
  <span id="counter" class="chip"></span>
  <button id="mute" class="chip" type="button">🔊</button>
  <button id="open-settings" class="chip" type="button">⚙️</button>
</div>
<button id="shake" class="shake" type="button"></button>

<div id="result" class="overlay" hidden>
  <div class="card">
    <div class="ribbon" data-s="fallen"></div>
    <div id="result-names" class="names"></div>
    <button id="next" class="next" type="button" data-s="next"></button>
  </div>
</div>

<dialog id="settings">
  <div class="dlg-head">
    <h2><span data-s="players"></span> <small id="total"></small></h2>
    <button id="close-settings" class="chip" type="button">✕</button>
  </div>
  <div class="pills">
    <label><input type="radio" name="mode" value="num"> <span data-s="modeNum"></span></label>
    <label><input type="radio" name="mode" value="name"> <span data-s="modeName"></span></label>
  </div>
  <div id="num-box">
    <div class="numhead"><span data-s="numCount"></span><output id="num-out"></output></div>
    <input id="num-range" type="range" min="2" max="50">
  </div>
  <div id="name-box">
    <textarea id="names" rows="10" spellcheck="false"></textarea>
    <p class="hint" data-s="namesHint"></p>
  </div>
  <div class="pills">
    <label><input type="radio" name="per-round" value="1"> 🥭</label>
    <label><input type="radio" name="per-round" value="2"> 🥭🥭</label>
    <label><input type="radio" name="per-round" value="3"> 🥭🥭🥭</label>
  </div>
  <label class="row"><input id="no-repeat" type="checkbox"> <span data-s="noRepeat"></span></label>
  <div class="dlg-head">
    <h3 data-s="history"></h3>
    <button id="regrow" type="button" data-s="regrow"></button>
  </div>
  <ol id="history"></ol>
</dialog>

<div id="toast" class="toast" hidden></div>
<script src="game.js"></script>
</body>
</html>
