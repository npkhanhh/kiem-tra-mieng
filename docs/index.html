<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiểm tra miệng</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Baloo 2", system-ui, sans-serif;
    background: linear-gradient(#bfe6ff, #fff6dd);
    color: #3b2410;
  }
  main { max-width: 960px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: clamp(36px, 7vw, 64px); margin: 0 0 32px; text-align: center; }
  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
  .game {
    display: block;
    padding: 24px;
    border-radius: 20px;
    background: #fff;
    box-shadow: 0 6px 0 #e3c98f, 0 10px 24px rgba(0, 0, 0, .12);
    color: inherit;
    text-decoration: none;
    text-align: center;
    transition: transform .15s;
  }
  .game:hover { transform: translateY(-4px) rotate(-1deg); }
  .game .icon { font-size: 72px; line-height: 1; }
  .game .name { font-size: 26px; font-weight: 800; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>Kiểm tra miệng</h1>
  <div class="games">
    <a class="game" href="games/xoai/">
      <div class="icon">🥭</div>
      <div class="name">Xoài rụng rồi!</div>
    </a>
  </div>
</main>
</body>
</html>
